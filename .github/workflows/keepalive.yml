name: Keep database awake

on:
  schedule:
    - cron: '0 6 */2 * *'   # every second day at 06:00 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the site, which reads from Supabase
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 30 \
            https://www.goldenheart.com.ng/api/keepalive
